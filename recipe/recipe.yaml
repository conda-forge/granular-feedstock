context:
  name: "granular"
  version: "0.23.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 15a403087eb525197d30f7a8ca44682a2ddac67ce602ed47da0b1410ab61eb87

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - cloudpickle
    - msgpack-python
    - numpy

tests:
  - python:
      imports:
        - granular
      python_version: ${{ python_min }}.*


about:
  homepage: http://github.com/danijar/granular
  summary: Fast format for datasets.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - noahjutz
